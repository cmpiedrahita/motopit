# Integración continua de MotoPit.
# Corre en cada push y en cada PR hacia main: lint, tipos, pruebas y build.
# Si falla, el PR no se puede integrar (regla de protección de la rama main).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Revisión de tipos
        run: npm run typecheck

      - name: Pruebas automatizadas
        run: npm test

      - name: Build
        run: npm run build
